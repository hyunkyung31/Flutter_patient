name: patient_app
description: AI Cardiovascular Patient Application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ----------------------------
  # State Management
  # ----------------------------
  provider: ^6.1.5

  # ----------------------------
  # Networking
  # ----------------------------
  dio: ^5.9.0

  # ----------------------------
  # Routing
  # ----------------------------
  go_router: ^17.3.0

  # Environment
  flutter_dotenv: ^5.2.1

  # ----------------------------
  # Local Storage
  # ----------------------------
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3

  # ----------------------------
  # Authentication
  # ----------------------------
  local_auth: ^3.0.2
  kakao_flutter_sdk_user: ^2.0.0+1

  # ----------------------------
  # Firebase
  # ----------------------------
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # ----------------------------
  # Google Maps
  # ----------------------------
  google_maps_flutter: ^2.13.1

  # ----------------------------
  # Utilities
  # ----------------------------
  intl: ^0.20.2

  # ----------------------------
  # UI
  # ----------------------------
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env